<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e3a5f">
  <title>Offline - Gestão de Ensaio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #0f1f35 0%, #1e3a5f 50%, #2d4a6f 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    
    .container {
      max-width: 400px;
      width: 100%;
    }
    
    .icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 30px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.8;
        transform: scale(0.95);
      }
    }
    
    h1 {
      font-size: 28px;
      margin-bottom: 16px;
      font-weight: 700;
    }
    
    p {
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
      opacity: 0.9;
    }
    
    .button {
      display: inline-block;
      background: #d4af37;
      color: #1e3a5f;
      padding: 14px 32px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.2s;
      cursor: pointer;
      border: none;
    }
    
    .button:hover {
      background: #f5d76e;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
    }
    
    .button:active {
      transform: translateY(0);
    }
    
    .status {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Você está offline</h1>
    <p>
      Não foi possível conectar à internet. Verifique sua conexão e tente novamente.
    </p>
    <button class="button" onclick="window.location.reload()">
      Tentar Novamente
    </button>
    <div class="status" id="status"></div>
  </div>
  
  <script>
    // Verificar conexão periodicamente
    function checkConnection() {
      const statusEl = document.getElementById('status');
      
      if (navigator.onLine) {
        statusEl.textContent = 'Conexão detectada! Recarregando...';
        setTimeout(() => {
          window.location.reload();
        }, 1000);
      } else {
        statusEl.textContent = 'Aguardando conexão...';
      }
    }
    
    // Verificar a cada 3 segundos
    setInterval(checkConnection, 3000);
    checkConnection();
    
    // Escutar eventos de conexão
    window.addEventListener('online', () => {
      document.getElementById('status').textContent = 'Conexão restaurada! Recarregando...';
      setTimeout(() => {
        window.location.reload();
      }, 1000);
    });
    
    window.addEventListener('offline', () => {
      document.getElementById('status').textContent = 'Conexão perdida.';
    });
  </script>
</body>
</html>
